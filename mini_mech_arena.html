<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mini Mech Arena – Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: sans-serif;
    color: white;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 16px;
  }
  #centerMsg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.6);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 20px;
    z-index: 20;
  }
  /* Virtual joystick */
  #joystick {
    position: fixed;
    bottom: 60px;
    left: 60px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 20;
    touch-action: none;
  }
  #stick {
    position: absolute;
    width: 50px;
    height: 50px;
    left: 35px;
    top: 35px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    z-index: 21;
    touch-action: none;
  }
</style>
</head>
<body>

<div id="ui">
  <div>Mini Mech Arena – Mobile</div>
  <div>Time: <span id="time">5:00</span></div>
  <div>Score: <span id="score">0</span></div>
</div>

<div id="centerMsg">Tap to start</div>

<!-- Virtual joystick -->
<div id="joystick"><div id="stick"></div></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
/* ------------------------------
   BASIC THREE.JS SETUP
--------------------------------*/
let scene, camera, renderer;
let enemies = [];
let bullets = [];
let score = 0;
let startTime = null;
let gameOver = false;
let lastTime = performance.now();

const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const centerMsg = document.getElementById("centerMsg");

/* ------------------------------
   INITIALIZE SCENE
--------------------------------*/
init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x101020);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(hemi);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x202040 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  spawnEnemies(8);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setupTouchControls();
}

/* ------------------------------
   ENEMY SPAWNING
--------------------------------*/
function spawnEnemies(n) {
  for (let i = 0; i < n; i++) {
    const e = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0xff5555 })
    );
    e.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
    e.userData.hp = 3;
    e.userData.speed = 2 + Math.random();
    scene.add(e);
    enemies.push(e);
  }
}

/* ------------------------------
   SHOOTING
--------------------------------*/
function shoot() {
  if (!startTime || gameOver) return;

  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  bullet.position.copy(camera.position);
  bullet.userData.velocity = dir.multiplyScalar(40);
  bullet.userData.life = 1.5;

  scene.add(bullet);
  bullets.push(bullet);
}

/* ------------------------------
   TOUCH CONTROLS
--------------------------------*/
let joystick = document.getElementById("joystick");
let stick = document.getElementById("stick");
let moveX = 0, moveY = 0;
let isTouchingRight = false;
let lastTouchX = 0, lastTouchY = 0;

function setupTouchControls() {
  centerMsg.addEventListener("touchstart", () => {
    centerMsg.style.display = "none";
    startTime = performance.now();
  });

  /* Joystick movement */
  joystick.addEventListener("touchstart", (e) => {
    e.preventDefault();
  });

  joystick.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const rect = joystick.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - (rect.left + rect.width / 2);
    const y = touch.clientY - (rect.top + rect.height / 2);

    const dist = Math.min(40, Math.sqrt(x*x + y*y));
    const angle = Math.atan2(y, x);

    stick.style.left = 60 + Math.cos(angle) * dist - 25 + "px";
    stick.style.top = 60 + Math.sin(angle) * dist - 25 + "px";

    moveX = Math.cos(angle) * (dist / 40);
    moveY = Math.sin(angle) * (dist / 40);
  });

  joystick.addEventListener("touchend", () => {
    stick.style.left = "35px";
    stick.style.top = "35px";
    moveX = moveY = 0;
  });

  /* Right side: look + shoot */
  document.body.addEventListener("touchstart", (e) => {
    if (e.touches[0].clientX > window.innerWidth * 0.5) {
      isTouchingRight = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      shoot();
    }
  });

  document.body.addEventListener("touchmove", (e) => {
    if (!isTouchingRight) return;
    const t = e.touches[0];
    const dx = t.clientX - lastTouchX;
    const dy = t.clientY - lastTouchY;

    camera.rotation.y -= dx * 0.005;
    camera.rotation.x -= dy * 0.005;
    camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x));

    lastTouchX = t.clientX;
    lastTouchY = t.clientY;
  });

  document.body.addEventListener("touchend", () => {
    isTouchingRight = false;
  });
}

/* ------------------------------
   GAME LOOP
--------------------------------*/
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const delta = (now - lastTime) / 1000;
  lastTime = now;

  update(delta);
  renderer.render(scene, camera);
}

function update(delta) {
  if (gameOver || !startTime) return;

  /* Timer */
  const elapsed = performance.now() - startTime;
  const remaining = Math.max(0, 5 * 60 * 1000 - elapsed);
  const sec = Math.floor(remaining / 1000);
  timeEl.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;

  if (remaining <= 0) {
    gameOver = true;
    centerMsg.style.display = "block";
    centerMsg.textContent = `Time's up! Score: ${score}`;
  }

  /* Movement */
  const speed = 10 * delta;
  const forward = new THREE.Vector3(Math.sin(camera.rotation.y), 0, Math.cos(camera.rotation.y));
  const right = new THREE.Vector3(forward.z, 0, -forward.x);

  camera.position.addScaledVector(forward, -moveY * speed);
  camera.position.addScaledVector(right, moveX * speed);

  /* Bullets */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.velocity, delta);
    b.userData.life -= delta;
    if (b.userData.life <= 0) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }

  /* Enemies */
  enemies.forEach((e, idx) => {
    const dir = camera.position.clone().sub(e.position);
    dir.y = 0;
    dir.normalize();
    e.position.addScaledVector(dir, e.userData.speed * delta);

    bullets.forEach((b, bi) => {
      if (b.position.distanceTo(e.position) < 1.2) {
        e.userData.hp--;
        scene.remove(b);
        bullets.splice(bi, 1);

        if (e.userData.hp <= 0) {
          score += 10;
          scoreEl.textContent = score;
          scene.remove(e);
          enemies.splice(idx, 1);
          spawnEnemies(1);
        }
      }
    });
  });
}
</script>
</body>
</html>
